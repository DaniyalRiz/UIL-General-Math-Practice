<!DOCTYPE html>
<!-- UIL Math Practice v2.1 — centered nav, no logo -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Problems: UIL Math Practice</title>
<script>
  // Correct the title before the bundle loads. The <title> above is a static
  // guess, so deep-linking to any other tab showed "Problems" for the few
  // hundred ms until React mounted and the effect in app.jsx ran. The active
  // tab is already persisted to localStorage, so the right answer is knowable
  // at first paint.
  // Keep TABS in sync with TAB_TITLES in js/src/app.jsx, which takes over from
  // here once React mounts. Sub-views (Recommended Practice, Redo Misses,
  // Review Later) are deliberately absent: `view` is not persisted, so a reload
  // always lands back on the plain list.
  (function () {
    var TABS = {
      problems: 'Problems',
      analytics: 'Analytics',
      history: 'History',
      mastery: 'Mastery',
      leaderboard: 'Leaderboard',
      admin: 'Admin',
      settings: 'Settings',
      reportBug: 'Report a Bug'
    };
    try {
      // useLocalStorage writes JSON, so the stored value is a quoted string.
      var tab = JSON.parse(localStorage.getItem('current_tab'));
      if (TABS[tab]) document.title = TABS[tab] + ': UIL Math Practice';
    } catch (e) { /* private mode, or a malformed value: keep the static title */ }
  })();
</script>
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"/>
<meta name="description" content="Practice UIL General Mathematics with real questions from District, Region, and TMSCA tests." />
<link rel="canonical" href="https://daniyalriz.github.io/UIL-General-Math-Practice/app.html"/>
<link rel="stylesheet" href="./styles/tailwind.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', system-ui, sans-serif; }
  .font-display { font-family: 'Fraunces', Georgia, serif; }
  .whitespace-pre-line { white-space: pre-line; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950">
<script>
  window.addEventListener("error", function(e){
    var r = document.getElementById("root");
    if(r && r.dataset.loaded !== "1"){ r.innerHTML = "<div style='padding:40px;font-family:sans-serif;color:#b91c1c'><b>Something went wrong loading the app.</b><br><br>" + (e.message||"") + "</div>"; }
  });
</script>
<div id="root"><div style="padding:40px;text-align:center;font-family:sans-serif;color:#64748b">Loading practice questions…</div></div>
<script type="module" src="./js/src/app.jsx"></script>
</body>
</html>
